<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>指尖花开</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&amp;text=%E6%8C%87%E5%B0%96%E8%8A%B1%E5%BC%80&amp;display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- BODY-START -->
    <div id="stage" aria-label="粒子花朵，可触摸交互"></div>

    <header class="hud">
      <h1 class="title">指尖花开</h1>
      <ul class="hints" aria-label="操作说明">
        <li><b>长按</b>收拢成花苞，松开绽放</li>
        <li><b>双指</b>捏合 / 张开，控制开合</li>
        <li><b>滑动</b>指尖拨动花瓣</li>
      </ul>
    </header>

    <footer class="meter" aria-live="polite">
      <div class="meter-row">
        <span id="state" class="state">绽放</span>
        <span class="spec">24 片花瓣 · 3 层</span>
        <span id="pct" class="pct">0%</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </footer>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <!-- BODY-END -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
